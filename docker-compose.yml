services:
  metadata:
    image: postgres:16
    container_name: snowbridge-metadata
    environment:
      POSTGRES_DB: snowbridge_metadata
      POSTGRES_USER: snowbridge
      POSTGRES_PASSWORD: snowbridge
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowbridge -d snowbridge_metadata"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - snowbridge_metadata_data:/var/lib/postgresql/data

volumes:
  snowbridge_metadata_data:
