[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snowbridge"
version = "0.3.0"
description = "Enterprise database migration platform"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.3.7,<4",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
mysql = ["mysql-connector-python>=8.0,<10"]
oracle = ["oracledb>=2.0,<5"]
discovery = ["mysql-connector-python>=8.0,<10", "oracledb>=2.0,<5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
