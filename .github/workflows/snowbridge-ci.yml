name: Snowbridge contract checks

on:
  push:
    branches: ["v2/**"]
  pull_request:
    branches: ["v2/**"]

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: snowbridge_test
          POSTGRES_USER: snowbridge
          POSTGRES_PASSWORD: snowbridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snowbridge -d snowbridge_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SNOWBRIDGE_TEST_DATABASE_URL: postgresql://snowbridge:snowbridge@localhost:5432/snowbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        working-directory: backend
        run: python -m pip install -e .
      - name: Run domain contract tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Apply metadata schema twice (idempotency check)
        working-directory: backend
        run: |
          python -m snowbridge.metadata.migrate --dsn "$SNOWBRIDGE_TEST_DATABASE_URL"
          python -m snowbridge.metadata.migrate --dsn "$SNOWBRIDGE_TEST_DATABASE_URL"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
